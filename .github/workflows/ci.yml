name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/* pg/*.sh kafka/*.sh
      - name: Compose files parse
        run: docker compose -f compose.base.yaml -f spike/compose.spike.yaml config -q
      - name: spike-check (sections that need no running stack)
        run: scripts/spike-check secrets up-version up-order static-config
