# The hand-written base platform (design checkpoint §4.10). Off-the-shelf containers arrive
# issue by issue in build step 1 (E03). Every container: image by digest, cap_drop ALL with a
# commented cap_add list, restart unless-stopped, a health check, secrets as files only.
name: setpiece

networks:
  # §4.12. Kong (443) is the only port published to the outside.
  edge: {}
  # Keycloak and what talks to it. No route out of the host (§4.12b).
  idp:
    internal: true
  # Kong, edge-auth, chassis services, OpenFGA, Postgres, Kafka, the OTLP Collector.
  services: {}
  # Only Postgres, Kafka, Kafka Connect, each <svc>-connector and kafka-init (§4.12).
  data:
    internal: true
  # The Collectors, Kong's status listener and otel-lgtm.
  ops: {}

# Container output goes to the OTel Collector through Docker's fluentd driver (§4.10; spec I-2).
# Async and non-blocking with a buffer, so a container still starts while the Collector is down.
# Every container uses it except the OTel Collector and otel-lgtm, which use `local`.
x-logging: &logging
  driver: fluentd
  options:
    fluentd-address: 127.0.0.1:24224
    fluentd-async: "true"
    mode: non-blocking
    max-buffer-size: 4m
    tag: "{{.Name}}"

x-postgres-image: &postgres-image postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
x-openfga-image: &openfga-image openfga/openfga:v1.23.0@sha256:2a1b4ef95f2f27e6d420f11cf14390b4f537e699de8d18b6a07d8b355e11cf02

services:
  # §4.3. The slot settings are fixed constants here; the generator fails if services need more.
  postgres:
    image: *postgres-image
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=16
      - -c
      - max_wal_senders=16
      - -c
      - max_slot_wal_keep_size=10GB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-superuser
    secrets: [postgres-superuser]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./pg/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # The directory, not a file, so generated lines work on a running server (§4.3).
      - ./pg/hba.d:/etc/postgresql/hba.d:ro
    networks: [services, data, idp]
    cap_drop: [ALL]
    logging: *logging
    # The entrypoint chowns the data directory and drops to the postgres user (§4.12b).
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: the Keycloak, OpenFGA and monitor databases and roles (§4.3). Runs on every scripts/up.
  pg-init:
    image: *postgres-image
    entrypoint: ["/pg/init.sh"]
    user: postgres
    secrets: [postgres-superuser, keycloak-db, openfga-db, monitor-db]
    volumes:
      - ./pg/init.sh:/pg/init.sh:ro
      - ./pg/init.base.sql:/pg/init.base.sql:ro
    tmpfs: [/tmp]
    networks: [services]
    cap_drop: [ALL]
    logging: *logging
    # No capabilities: it only runs psql as the postgres user.
    cap_add: []
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: OpenFGA's schema. Reads the datastore URI from the rendered config (§4.12b, R7-R M4).
  openfga-migrate:
    image: *openfga-image
    command: [migrate]
    secrets:
      - source: openfga-config
        target: /etc/openfga/config.yaml
    networks: [services]
    cap_drop: [ALL]
    logging: *logging
    # No capabilities: a non-root (65532) Go binary.
    cap_add: []
    depends_on:
      pg-init:
        condition: service_completed_successfully

  openfga:
    image: *openfga-image
    command: [run]
    # The datastore URI and the preshared key come from this file, never the environment (B-5).
    secrets:
      - source: openfga-config
        target: /etc/openfga/config.yaml
    networks: [services]
    cap_drop: [ALL]
    logging: *logging
    # No capabilities: a non-root (65532) Go binary on unprivileged ports.
    cap_add: []
    restart: unless-stopped
    healthcheck:
      # Exec form: the image is distroless and ships this probe (§4.7).
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  # Kong 3.9 open source, DB-less from the hand-written kong/kong.yaml (spec F-1; R-0 option A).
  kong:
    image: kong:3.9.5@sha256:e9b87ddd0e6087792586e2cbba5ce91eadcbdd3d3673249aa4606f7207408c0d
    restart: unless-stopped
    user: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      KONG_ADMIN_LISTEN: "off"
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_STATUS_LISTEN: "off"
      KONG_PROXY_LISTEN: "0.0.0.0:8443 ssl"
      KONG_SSL_CERT: /run/secrets/kong-tls.crt
      KONG_SSL_CERT_KEY: /run/secrets/kong-tls.key
      KONG_UNTRUSTED_LUA: sandbox
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: resty.http
      # Two workers, not one per core: the host is shared (spec §4 stop rule; 20 workers used 1.2 GB).
      KONG_NGINX_WORKER_PROCESSES: "2"
    # The only port published to the outside (§4.12). SETPIECE_PUBLISH_ADDRESS (in .env) narrows
    # it to one host address where another process already holds 443 on another address
    # (spec open question 4; on harry-msi-server tailscaled holds it on the tailnet address).
    ports:
      - "${SETPIECE_PUBLISH_ADDRESS:-0.0.0.0}:443:8443"
    secrets: [kong-tls.crt, kong-tls.key]
    volumes:
      - ./kong/kong.yaml:/kong/kong.yaml:ro
    # cap_add: none. Kong listens on 8443 inside the container, so it needs no NET_BIND_SERVICE.
    cap_drop: [ALL]
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # idp for the sign-in routes (§4.12; spec J-1).
    networks: [edge, idp, services]

  # A stub edge-auth in plain Node, run as a mounted script (spec F-2). Not the real service.
  edge-auth:
    image: node:26@sha256:f8e5d4bb28fa55c74f1345166a082a10b7c68f22304350c1ce0d18358ae94996
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    command: ["node", "/app/stub.mjs"]
    volumes:
      - ./edge-auth/stub.mjs:/app/stub.mjs:ro
    # cap_add: none. It listens on 8080 as an unprivileged user.
    cap_drop: [ALL]
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [services, idp]

  # Receives OTLP and fluent-forward and sends to otel-lgtm (spec I-1). Its config file is
  # its only mount. The image has no shell or HTTP client, so the health check runs the
  # Collector's own binary (spec A-8): `validate` proves the binary runs and the config parses,
  # not that pipelines are live; spike-check telemetry proves those.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    # cap_add: none
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:24224:24224"
    networks: [services, ops]
    logging:
      driver: local
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Host metrics as far as a container sees them: no host /proc, Docker socket, container logs
  # or ./secrets, and a uid no other container uses (spec I-1).
  otel-hostmetrics:
    image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    user: "10101:10101"
    read_only: true
    cap_drop: [ALL]
    # cap_add: none
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    volumes:
      - ./otel/hostmetrics.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [ops]
    logging: *logging
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Grafana, Loki, Tempo and Prometheus in one container, behind the Collector (R-9; §4.9).
  # Metrics kept 35 days, logs and traces 7 days, on a named volume (spec I-3). Grafana only on
  # 127.0.0.1, anonymous login off, admin password from a secret file (spec I-4). Grafana applies
  # the password only when it creates its database on the volume; to rotate it, reset the volume
  # or run `grafana cli admin reset-admin-password` in the container.
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
    cap_drop: [ALL]
    # cap_add: none
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=35d
      LOKI_EXTRA_ARGS: -compactor.retention-enabled=true -compactor.delete-request-store=filesystem -store.retention=168h
      TEMPO_EXTRA_ARGS: -backend-worker.compaction.block-retention=168h -backend-scheduler.provider.work.compaction.block-retention=168h
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: $$__file{/run/secrets/grafana-admin}
    secrets: [grafana-admin]
    volumes:
      - otel-lgtm-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    networks: [ops]
    logging:
      driver: local
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Kafka, one combined KRaft node (§4.10; M0007; spec D-1). kafka/start.sh replaces the
  # image's command and reads the passwords from /run/secrets at run time.
  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    entrypoint: ["/bin/bash", "/opt/setpiece/start.sh"]
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - ./kafka:/opt/setpiece:ro
      - kafka-data:/var/lib/kafka/data
    secrets: [kafka-admin, kafka-connect, kafka-connect-producer]
    networks: [services, data]
    restart: unless-stopped
    cap_drop: [ALL]
    logging: *logging
    # cap_add: none. Runs as the image's appuser (uid 1000) and binds only 9092 and 9093.
    healthcheck:
      # A small heap for the check's own JVM, which would otherwise take the broker's 512 MB.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh
             --bootstrap-server localhost:9092 --command-config /tmp/kafka/admin.properties > /dev/null"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s

  # One-shot: users, topics and ACLs, as admin, from the same image (§4.10; spec D-2).
  kafka-init:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    entrypoint: ["/bin/bash", "/opt/setpiece/init.sh"]
    volumes:
      - ./kafka:/opt/setpiece:ro
    secrets: [kafka-admin, kafka-connect, kafka-connect-producer, kafka-svc-collector, kafka-svc-spike]
    networks: [data]
    depends_on:
      kafka:
        condition: service_healthy
    cap_drop: [ALL]
    logging: *logging
    # cap_add: none. Runs as appuser and only opens client connections.

  # Kafka Connect with Debezium (§4.10; spec D-4). On data only: its REST API is
  # unauthenticated, so no service can reach it (§4.12).
  connect:
    image: quay.io/debezium/connect:3.7@sha256:b201d71ac09a2e9c52cbe9e4079cc1e6fd48d5158d9f662f172208a9f6da2f4c
    entrypoint: ["/kafka/bin/connect-distributed.sh", "/opt/setpiece/worker.properties"]
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_LOG4J_OPTS: "-Dlog4j2.configurationFile=/kafka/config.orig/connect-log4j2.yaml"
    volumes:
      - ./connect/worker.properties:/opt/setpiece/worker.properties:ro
    secrets: [kafka-connect, kafka-connect-producer]
    networks: [data]
    depends_on:
      # P-1, the step 1 half (spec D-3).
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cap_drop: [ALL]
    logging: *logging
    # cap_add: none. Runs as the image's kafka user (uid 1001) and binds only 8083.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
  # Keycloak (M0014), on its own database from pg-init (spec C-2, E-1). On `idp` only (§4.12;
  # punch list P-6). Its passwords come from mounted files through keycloak/start.sh (B-5, B-6).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    entrypoint: ["/bin/bash", "/opt/setpiece/start.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HTTP_ENABLED: "true"
      # The public issuer URL is set with Kong's routes in build step 5 (§4.12).
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/start.sh:/opt/setpiece/start.sh:ro
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    secrets: [keycloak-db, keycloak-admin]
    # Holds the config file keycloak/start.sh writes; never on disk.
    tmpfs: ["/run/keycloak:mode=0700,uid=1000,gid=0"]
    depends_on:
      pg-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [idp]
    # cap_add: none. Keycloak runs as uid 1000 and needs no capability.
    cap_drop: [ALL]
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      # The image has no curl: ask the management port's readiness endpoint over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  postgres-data: {}
  otel-lgtm-data: {}
  kafka-data: {}

# Each container mounts only the files it declares (§4.12b). scripts/secrets-init writes them.
secrets:
  postgres-superuser:
    file: ./secrets/postgres-superuser
  keycloak-db:
    file: ./secrets/keycloak-db
  keycloak-admin:
    file: ./secrets/keycloak-admin
  openfga-db:
    file: ./secrets/openfga-db
  monitor-db:
    file: ./secrets/monitor-db
  openfga-config:
    file: ./secrets/openfga-config
  kong-tls.crt:
    file: ./secrets/kong-tls.crt
  kong-tls.key:
    file: ./secrets/kong-tls.key
  grafana-admin:
    file: ./secrets/grafana-admin
  kafka-admin:
    file: ./secrets/kafka-admin
  kafka-connect:
    file: ./secrets/kafka-connect
  kafka-connect-producer:
    file: ./secrets/kafka-connect-producer
  kafka-svc-collector:
    file: ./secrets/kafka-svc-collector
  kafka-svc-spike:
    file: ./secrets/kafka-svc-spike
