# Hand-written base allowlist (design checkpoint §4.3 "pg_hba.conf is an allowlist").
# Mounted at /etc/postgresql/pg_hba.conf and named by the hba_file setting in compose.base.yaml.
# TYPE  DATABASE  USER      ADDRESS  METHOD

# The image's entrypoint and in-container psql run as the postgres OS user over the socket.
local   all       postgres           peer
# The superuser over the network: only pg-init and pg-init-services use it.
host    all       postgres  samenet  scram-sha-256

# The base database and role pairs.
host    keycloak  keycloak  samenet  scram-sha-256
host    openfga   openfga   samenet  scram-sha-256
host    monitor   monitor   samenet  scram-sha-256

# Generated lines (pg/hba.d/services.conf) and the spike fixture. No `host replication all` line.
# Unquoted: pg_hba.conf has no single quotes, so §4.3's `include_dir 'hba.d'` would name "'hba.d'".
include_dir hba.d
