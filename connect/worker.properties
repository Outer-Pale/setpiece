# The Kafka Connect worker (design checkpoint §4.10 "Kafka Connect"; §4.14 "Kafka down while
# Connect runs"; spec D-4). Passwords come from /run/secrets through DirectoryConfigProvider,
# never from CONNECT_* environment values (M0013).
bootstrap.servers=kafka:9092
group.id=connect-cluster
plugin.path=/kafka/connect

config.providers=dir
config.providers.dir.class=org.apache.kafka.common.config.provider.DirectoryConfigProvider
config.providers.dir.param.allowed.paths=/run/secrets

# The worker itself signs in as connect.
security.protocol=SASL_PLAINTEXT
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="connect" password="${dir:/run/secrets:kafka-connect}";

# Connector producers sign in as connect-producer, and wait out a Kafka outage.
producer.security.protocol=SASL_PLAINTEXT
producer.sasl.mechanism=SCRAM-SHA-512
producer.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="connect-producer" password="${dir:/run/secrets:kafka-connect-producer}";
producer.delivery.timeout.ms=2147483647
producer.retries=2147483647

# Connector consumers and admin clients sign in as connect.
consumer.security.protocol=SASL_PLAINTEXT
consumer.sasl.mechanism=SCRAM-SHA-512
consumer.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="connect" password="${dir:/run/secrets:kafka-connect}";
admin.security.protocol=SASL_PLAINTEXT
admin.sasl.mechanism=SCRAM-SHA-512
admin.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="connect" password="${dir:/run/secrets:kafka-connect}";

# No connector config can switch to another principal (R3 design M-9).
connector.client.config.override.policy=None

config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1

key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter

# The REST API. Connect is on the data network only, so no service can reach it (§4.12).
listeners=http://:8083
rest.advertised.host.name=connect
rest.advertised.port=8083
