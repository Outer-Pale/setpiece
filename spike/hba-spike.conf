# The K-3 fixture's pg_hba lines (E03 spec §2a). spike-check k3 copies this file to
# pg/hba.d/spike.conf (git-ignored) and reloads Postgres. A logical replication connection
# matches the database name, so no `replication` line is needed (§4.3).
host    spike     spike_owner  samenet  scram-sha-256
host    spike     spike_cdc    samenet  scram-sha-256
