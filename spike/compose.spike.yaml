# Test-only overlay for build step 1's checks (spec §2a). Never loaded by scripts/up.
# Used as: docker compose -f compose.base.yaml -f spike/compose.spike.yaml ...
services:
  # A long-running container on `services` that the checks probe from (K-5b, I-2, B-5, K-6).
  stand-in:
    image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command: ["sleep", "infinity"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [services]
    # The base file's fluentd block (an anchor can't cross files), for the I-2 marker test.
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"
        mode: non-blocking
        max-buffer-size: 4m
        tag: "{{.Name}}"

  # An HTTP and TLS client the checks attach to a network or another container's namespace
  # (K-4 on idp, K-6). One-shot: `docker compose ... run --rm probe <command>`.
  probe:
    image: curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
    profiles: [probe]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [services]

  # The upstream for Kong's K-1 test routes. Answers every request with the headers it received.
  echo:
    image: node:26@sha256:f8e5d4bb28fa55c74f1345166a082a10b7c68f22304350c1ce0d18358ae94996
    command: ["node", "/app/echo.mjs"]
    volumes:
      - ./spike/echo.mjs:/app/echo.mjs:ro
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [services]

  # The two targets of Kong's K-2 upstream.
  target-a: &target
    image: node:26@sha256:f8e5d4bb28fa55c74f1345166a082a10b7c68f22304350c1ce0d18358ae94996
    command: ["node", "/app/target.mjs"]
    environment:
      TARGET_NAME: target-a
    volumes:
      - ./spike/target.mjs:/app/target.mjs:ro
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [services]
  target-b:
    <<: *target
    environment:
      TARGET_NAME: target-b

  # One-shot: the K-3 database `spike`, its roles, the §4.2 tables, publication and grants.
  # Run by spike-check k3 with `run --rm`; never by `up`.
  spike-init:
    image: postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
    profiles: [spike-init]
    entrypoint: ["/spike/spike-init.sh"]
    user: postgres
    secrets: [postgres-superuser, spike_owner, spike_cdc]
    volumes:
      - ./spike/spike-init.sh:/spike/spike-init.sh:ro
      - ./spike/spike-roles.sql:/spike/spike-roles.sql:ro
      - ./spike/spike-outbox.sql:/spike/spike-outbox.sql:ro
    tmpfs: [/tmp]
    networks: [services]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-shot: the K-5 Node 26 reader and refused writer, as svc-spike (spec K-5; §4.13).
  # Run by spike-check k5 with `run --rm k5 <key> <ce_id>`. It installs the locked @platformatic/kafka
  # into its tmpfs, reads the record with that key, then tries to produce.
  k5:
    image: node:26@sha256:f8e5d4bb28fa55c74f1345166a082a10b7c68f22304350c1ce0d18358ae94996
    profiles: [k5]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /tmp/app && cp /spike/package.json /spike/package-lock.json /spike/k5-consume.mjs /spike/k5-produce.mjs /tmp/app/
        cd /tmp/app && npm ci --omit=dev --no-audit --no-fund --loglevel=error >&2
        node k5-consume.mjs "$$1" "$$2" || true
        node k5-produce.mjs
      - k5
    environment:
      HOME: /tmp
    user: "1000:1000"
    secrets: [kafka-svc-spike]
    volumes:
      - ./spike/package.json:/spike/package.json:ro
      - ./spike/package-lock.json:/spike/package-lock.json:ro
      - ./spike/k5-consume.mjs:/spike/k5-consume.mjs:ro
      - ./spike/k5-produce.mjs:/spike/k5-produce.mjs:ro
    tmpfs: [/tmp:exec]
    networks: [services]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Connect gets the K-3 connector's password file. Applying the overlay recreates connect;
  # the next base-only scripts/up recreates it back (plan issue 8).
  connect:
    secrets: [kafka-connect, kafka-connect-producer, spike_cdc]

secrets:
  # Written by spike-check k3 into ./secrets, under the same rules as B-2.
  spike_owner:
    file: ./secrets/spike_owner
  spike_cdc:
    file: ./secrets/spike_cdc
