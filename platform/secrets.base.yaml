# The base secrets that scripts/secrets-init writes into ./secrets (design checkpoint §4.10).
# This file is the authority for the list. One entry per line: `<file name>: <kind>`.
# Kinds:
#   password     32 alphanumeric characters, no trailing newline
#   pem-key      an Ed25519 private key, PKCS#8 PEM
#   certificate  a self-signed TLS certificate and its key: <name>.crt and <name>.key
#   config       a config file holding secrets, rendered by the issue that adds its product
# Per-service secrets come from contracts/*/declarations.json once services exist (step 5 on).

postgres-superuser: password
keycloak-db: password
keycloak-admin: password
openfga-db: password
openfga-preshared-key: password
monitor-db: password
grafana-admin: password
kafka-admin: password
kafka-connect: password
kafka-connect-producer: password
kafka-svc-collector: password
kafka-svc-spike: password
edge-auth-signing-key: pem-key
kong-tls: certificate
openfga-config: config
